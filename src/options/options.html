<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>gpt-term 설정</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="topbar">
    <span class="dot"></span>
    <span class="brand">gpt-term</span>
    <span class="title">:config — chrome.storage.sync</span>
    <span class="saved" id="saved"></span>
  </div>

  <div class="wrap">
    <nav id="nav"></nav>
    <main id="fields"></main>
  </div>

  <div class="statusline">
    <span class="mode">CONFIG</span>
    <span class="seg" id="count"></span>
    <span class="spacer"></span>
    <button id="reset" class="linkbtn">전체 기본값으로</button>
    <span class="seg dim">모든 기기에 동기화된다</span>
  </div>

  <script src="../shared/defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
